# Build + publish a Windows installer on every version tag (v*). GitHub releases
# become the auto-update feed (latest.yml is generated by electron-builder).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag
        run: |
          if ("$env:GITHUB_REF_NAME" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "unexpected ref: $env:GITHUB_REF_NAME" }
      # electron-builder --publish always already created the release + assets;
      # we only attach the changelog as release notes.
      - name: Attach release notes from changelog
        run: gh release edit "$env:TAG_NAME" --notes-file CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
