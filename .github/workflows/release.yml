# Build + publish a Windows installer on every version tag (v*). GitHub releases
# are the auto-update feed: `latest.yml` (in the release root) tells
# electron-updater the names of the installer and its `.blockmap`. To guarantee
# the exe, the .blockmap, and latest.yml always land in the SAME release (no
# split/draft/release drift), we package locally (--publish never) and upload
# every artifact into one explicit release via `gh release create/upload`.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Validate the tag shape before doing any work.
      - name: Validate tag
        run: |
          if ("$env:GITHUB_REF_NAME" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "unexpected ref: $env:GITHUB_REF_NAME" }
      # Build + package INSTALLER, .blockmap, and latest.yml locally. A fresh
      # runner has no out/ otherwise. Keep electron-builder's publisher off
      # (--publish never) so file creation is ours to control.
      - name: Build & package
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
      # Notes: only THIS version's CHANGELOG section (### [<ver>] up to the next
      # ## heading) so release notes don't accumulate over releases.
      - name: Cut release notes
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $body = Get-Content -Raw CHANGELOG.md
          $m = [regex]::Match($body, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## )")
          if (-not $m.Success) { throw "no CHANGELOG section found for v$version" }
          Set-Content -Path RELEASE_NOTES.md -Value $m.Value.Trim()
          "wrote RELEASE_NOTES.md ($($m.Value.Length) chars)"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      # Create the release only if this tag doesn't have one yet (a rerun of the
      # same tag must not try to re-create an existing release).
      - name: Create release (if missing)
        run: |
          gh release view "$env:TAG_NAME" > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG_NAME" --notes-file RELEASE_NOTES.md
            echo "created release $env:TAG_NAME"
          } else {
            echo "release $env:TAG_NAME already exists — will update artifacts/notes"
          }
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload the installer + its .blockmap + latest.yml together — the update
      # feed (electron-updater reads release/latest.yml at the root).
      - name: Upload artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no installer produced in release/" }
          $blockmap = Get-ChildItem -Path release -Filter "*.exe.blockmap" | Select-Object -First 1
          if (-not $blockmap) { throw "no .blockmap produced in release/" }
          $yml = Join-Path "release" "latest.yml"
          if (-not (Test-Path $yml)) { throw "no latest.yml in release/" }
          gh release upload "$env:TAG_NAME" $exe.FullName $blockmap.FullName $yml --clobber
          "uploaded: $($exe.Name), $($blockmap.Name), latest.yml"
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Finalize notes on the SAME release (idempotent for re-runs).
      - name: Attach release notes
        run: |
          gh release edit "$env:TAG_NAME" --notes-file RELEASE_NOTES.md
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Convert the just-created draft into a public release at the end, so the
      # installer/latest.yml never go out before the notes are attached.
      - name: Publish release
        run: |
          gh release edit "$env:TAG_NAME" --draft=false
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}