<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- FCC Studio app icon — warm-gradient rounded-square badge, slimmer rounded
       "F" (solid union, one smooth gradient) + a terminal cursor block. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efb25f"/>
      <stop offset="1" stop-color="#d97a55"/>
    </linearGradient>
    <linearGradient id="shd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="rgba(60,28,0,0)"/>
      <stop offset="1" stop-color="rgba(60,28,0,0.16)"/>
    </linearGradient>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="70" y1="58" x2="200" y2="192">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ffd9ba"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#bg)"/>
  <rect x="12" y="10" width="232" height="118" rx="50" fill="rgba(255,255,255,0.12)"/>
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#shd)"/>
  <rect x="74" y="64" width="34" height="124" rx="17" fill="url(#fg)"/>
  <rect x="74" y="64" width="112" height="32" rx="16" fill="url(#fg)"/>
  <rect x="74" y="112" width="68" height="32" rx="16" fill="url(#fg)"/>
  <rect x="194" y="66" width="12" height="28" rx="6" fill="url(#fg)"/>
</svg>