      <stop offset="0" stop-color="#f7c27a"/>
      <stop offset="1" stop-color="#d06f4a"/>
    </linearGradient>
  </defs>
  <rect x="80" y="54" width="36" height="138" rx="18" fill="url(#g)"/>
  <rect x="80" y="54" width="118" height="34" rx="17" fill="url(#g)"/>
  <rect x="80" y="106" width="72" height="34" rx="17" fill="url(#g)"/>
  <rect x="206" y="58" width="12" height="30" rx="6" fill="url(#g)"/>
</svg>