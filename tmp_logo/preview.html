<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#0e1013; color:#e4e7ec; font-family:sans-serif; margin:24px; }
  .row { display:flex; gap:40px; align-items:flex-start; margin-bottom:40px; }
  .cell { text-align:center; }
  .cell .label { font-size:12px; color:#a0a8b4; margin-bottom:8px; }
  .tile { background:#14171c; border-radius:14px; padding:18px; display:flex; gap:16px; align-items:center; justify-content:center; }
  .big { width:128px; height:128px; }
  .sm { width:16px; height:16px; }
  .sm2 { width:16px; height:16px; }
  .cutout-tile { background:#d97a55; border-radius:10px; padding:6px; display:flex; }
</style>
</head>
<body>

<div class="row">
  <div class="cell"><div class="label">A (sw10) 128px</div><div class="tile"><img class="big" src="a.svg"></div></div>
  <div class="cell"><div class="label">B (sw12.5) 128px</div><div class="tile"><img class="big" src="b.svg"></div></div>
  <div class="cell"><div class="label">C (equal) 128px</div><div class="tile"><img class="big" src="c.svg"></div></div>
</div>

<div class="row">
  <div class="cell"><div class="label">A 16px</div><div class="tile"><img class="sm" src="a.svg"></div></div>
  <div class="cell"><div class="label">B 16px</div><div class="tile"><img class="sm" src="b.svg"></div></div>
  <div class="cell"><div class="label">C 16px</div><div class="tile"><img class="sm" src="c.svg"></div></div>
</div>

<div class="row">
  <div class="cell"><div class="label">A white-on-terracotta 16px</div><div class="cutout-tile"><img class="sm2" src="a.svg" style="filter:invert(1)"></div></div>
  <div class="cell"><div class="label">B white-on-terracotta 16px</div><div class="cutout-tile"><img class="sm2" src="b.svg" style="filter:invert(1)"></div></div>
</div>

</body>
</html>
